<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TactaTakTo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      text-align: center;
      padding-top: 50px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 5px;
      justify-content: center;
      margin: 20px auto;
    }

    .cell {
      background-color: #fff;
      border: 2px solid #333;
      font-size: 2em;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    .cell:hover {
      background-color: #f9f9f9;
    }

    #status {
      font-size: 1.2em;
      margin-bottom: 15px;
    }

    #resetBtn {
      padding: 10px 20px;
      font-size: 1em;
      cursor: pointer;
      background: #007BFF;
      color: #fff;
      border: none;
      border-radius: 5px;
    }

    #resetBtn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <h1>TactaTakTo</h1>
  <div id="status">Giliran: X</div>
  <div id="board"></div>
  <button id="resetBtn">Mulai Ulang</button>

  <script>
    const board = document.getElementById("board");
    const statusText = document.getElementById("status");
    const resetBtn = document.getElementById("resetBtn");

    let currentPlayer = "X";
    let cells = ["", "", "", "", "", "", "", "", ""];
    let gameOver = false;

    function drawBoard() {
      board.innerHTML = "";
      cells.forEach((cell, index) => {
        const div = document.createElement("div");
        div.classList.add("cell");
        div.dataset.index = index;
        div.textContent = cell;
        board.appendChild(div);
      });
    }

    function checkWinner() {
      const winCombos = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
      ];

      for (let combo of winCombos) {
        const [a, b, c] = combo;
        if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c]) {
          return cells[a];
        }
      }

      if (!cells.includes("")) return "Draw";

      return null;
    }

    function handleClick(e) {
      const index = e.target.dataset.index;
      if (cells[index] || gameOver) return;

      cells[index] = currentPlayer;
      drawBoard();

      const result = checkWinner();
      if (result) {
        gameOver = true;
        statusText.textContent = result === "Draw" ? "Hasil: Seri!" : `Pemenang: ${result}`;
      } else {
        currentPlayer = currentPlayer === "X" ? "O" : "X";
        statusText.textContent = `Giliran: ${currentPlayer}`;
      }
    }

    function resetGame() {
      currentPlayer = "X";
      cells = ["", "", "", "", "", "", "", "", ""];
      gameOver = false;
      statusText.textContent = "Giliran: X";
      drawBoard();
    }

    board.addEventListener("click", handleClick);
    resetBtn.addEventListener("click", resetGame);

    drawBoard();
  </script>
</body>
</html>
